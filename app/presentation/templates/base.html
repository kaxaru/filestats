<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Скачивание и анализ файлов{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <header>
    <nav>
      <a href="/" class="{% if active == 'download' %}is-active{% endif %}">Скачивание</a>
      <a href="/files" class="{% if active == 'files' %}is-active{% endif %}">Файлы и расчёты</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
